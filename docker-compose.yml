# Stack local do Conecta+: app + Prometheus + Grafana.
#   cp .env.example .env    (e troque as senhas)
#   docker compose up -d --build
# App: http://localhost:8000 | Prometheus: http://localhost:9090 | Grafana: http://localhost:3000
# As portas ficam presas em 127.0.0.1: nada fica aberto para a rede.

services:
  app:
    build: ./app
    image: conecta-mais:local
    environment:
      ADMIN_USUARIO: ${ADMIN_USUARIO:?defina no .env}
      ADMIN_SENHA: ${ADMIN_SENHA:?defina no .env}
      RPA_API_TOKEN: ${RPA_API_TOKEN:?defina no .env}
      DATABASE_PATH: /dados/app.sqlite3
    volumes:
      - dados_app:/dados
    ports:
      - "127.0.0.1:8000:8000"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.55.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=7d
    volumes:
      - ./observabilidade/prometheus:/etc/prometheus:ro
      - dados_prometheus:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    depends_on: [app]
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.3.1
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_SENHA:?defina no .env}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
    volumes:
      - ./observabilidade/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observabilidade/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - dados_grafana:/var/lib/grafana
    ports:
      - "127.0.0.1:3000:3000"
    depends_on: [prometheus]
    restart: unless-stopped

volumes:
  dados_app:
  dados_prometheus:
  dados_grafana:
