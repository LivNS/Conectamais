global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alertas.yml

scrape_configs:
  # App rodando no docker compose
  - job_name: conecta-local
    metrics_path: /metrics
    static_configs:
      - targets: ["app:8000"]
        labels: { ambiente: local }

  # MVP publicado no Render (HTTPS, /metrics protegido por token)
  # Crie o arquivo observabilidade/prometheus/render_token com o METRICS_TOKEN
  # (ele está no .gitignore e nunca vai para o repositório).
  - job_name: conecta-render
    scheme: https
    metrics_path: /metrics
    scrape_interval: 30s
    scrape_timeout: 20s
    authorization:
      type: Bearer
      credentials_file: /etc/prometheus/render_token
    static_configs:
      - targets: ["conecta-nznk.onrender.com"]
        labels: { ambiente: producao }
